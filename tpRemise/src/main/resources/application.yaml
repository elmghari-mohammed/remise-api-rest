server:
  port: 8090

spring:
  application:
    name: tpRemise

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  sql:
    init:
      mode: always                   # ← Exécute data.sql à chaque démarrage

  h2:
    console:
      enabled: true
      path: /h2-console
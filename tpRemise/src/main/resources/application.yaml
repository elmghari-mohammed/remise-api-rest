server:
  port: 8090

spring:
  application:
    name: tpRemise

  devtools:
    restart:
      enabled: false        # ← Empêche le redémarrage auto qui laisse des processus zombies
    add-properties: false   # ← Supprime le warning "Devtools property defaults active"

  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: true

  sql:
    init:
      mode: always

  h2:
    console:
      enabled: true
      path: /h2-console